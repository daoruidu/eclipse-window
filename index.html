<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#05080b" />
    <title>日蚀窗口 · ECLIPSE WINDOW</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080b;
        color: #f1f0e9;
      }
      body {
        font-family: Arial, "Microsoft YaHei", sans-serif;
        font-size: 12px;
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #9edfe9;
        outline-offset: 5px;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #scene:active {
        cursor: grabbing;
      }
      .frame {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 120px #0003;
      }
      .top {
        position: absolute;
        top: 35px;
        left: 42px;
        right: 42px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        transition: opacity 0.7s;
      }
      .wordmark {
        letter-spacing: 0.28em;
        font-size: 11px;
      }
      .top-right {
        display: flex;
        gap: 25px;
        align-items: center;
        pointer-events: auto;
      }
      .text-button {
        background: transparent;
        border: 0;
        padding: 8px 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        opacity: 0.7;
      }
      .text-button:hover {
        opacity: 1;
      }
      .hero {
        position: absolute;
        left: 8.5%;
        bottom: 24%;
        max-width: 650px;
        transition:
          opacity 1s,
          transform 1s;
        pointer-events: none;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.36em;
        color: #a8c4d0;
        margin-bottom: 24px;
      }
      .hero h1 {
        font-family: "Baskervville", "Songti SC", "SimSun", serif;
        font-weight: 400;
        letter-spacing: 0.15em;
        font-size: clamp(44px, 6.5vw, 94px);
        line-height: 1.2;
        margin: 0 0 21px;
        text-shadow: 0 2px 35px #0008;
      }
      .hero p {
        font-size: 13px;
        letter-spacing: 0.26em;
        color: #bbc8cc;
        line-height: 2;
        margin: 0;
      }
      .enter {
        pointer-events: auto;
        margin-top: 36px;
        display: inline-flex;
        gap: 30px;
        align-items: center;
        background: #ebeee6;
        color: #11212b;
        border: 0;
        padding: 16px 22px;
        font-size: 12px;
        letter-spacing: 0.15em;
        transition: background 0.2s;
      }
      .enter:hover {
        background: #bdefff;
      }
      .enter span {
        font-size: 18px;
        line-height: 1;
      }
      .hero small {
        display: block;
        font-size: 10px;
        color: #a5bac0;
        margin-top: 17px;
        letter-spacing: 0.12em;
      }
      .playing .hero {
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
      }
      .playing .enter {
        pointer-events: none;
      }
      .caption {
        position: absolute;
        bottom: 18%;
        left: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.7s;
        text-shadow: 0 1px 20px #000;
      }
      .caption.visible {
        opacity: 1;
      }
      .caption .zh {
        font-family: "Songti SC", "SimSun", serif;
        font-size: clamp(18px, 2vw, 29px);
        letter-spacing: 0.3em;
      }
      .caption .en {
        font-size: 10px;
        letter-spacing: 0.24em;
        margin-top: 15px;
        color: #b8c8ce;
      }
      .controls {
        position: absolute;
        bottom: 27px;
        left: 42px;
        right: 42px;
        transition: opacity 0.6s;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .transport {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .left-controls,
      .right-controls {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .control {
        background: transparent;
        border: 0;
        padding: 4px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
        opacity: 0.78;
      }
      .control:hover {
        opacity: 1;
      }
      .control.active {
        color: #a6e6ff;
        opacity: 1;
      }
      #clock {
        font-variant-numeric: tabular-nums;
        font-size: 10px;
        letter-spacing: 0.12em;
        color: #93a7b1;
      }
      .seek {
        appearance: none;
        width: 100%;
        height: 2px;
        margin: 0;
        background: #ffffff26;
        cursor: pointer;
        accent-color: #a0daed;
      }
      .seek::-webkit-slider-thumb {
        appearance: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #cedfe5;
      }
      .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100px;
        text-align: center;
        color: #b1c6cf80;
        font-size: 10px;
        letter-spacing: 0.12em;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      .clean .top,
      .clean .controls,
      .clean .hint {
        opacity: 0;
        pointer-events: none;
      }
      .clean .top-right {
        pointer-events: none;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 130px;
        transform: translateX(-50%);
        padding: 12px 18px;
        background: #0b1820df;
        border: 1px solid #54758155;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
      }
      .error {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #061018;
        padding: 30px;
        line-height: 1.9;
      }
      .error.show {
        display: flex;
      }
      .error div {
        max-width: 500px;
      }
      .error strong {
        font-size: 22px;
      }
      #error-detail {
        color: #a7bdc6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .recording #record {
        color: #ffb5a4;
      }
      .loading {
        position: absolute;
        right: 43px;
        bottom: 117px;
        color: #9db2bc;
        letter-spacing: 0.1em;
        transition: opacity 0.5s;
      }
      .ready .loading {
        opacity: 0;
      }
      .quiet .hint {
        opacity: 0;
      }
      @media (max-width: 650px) {
        .top {
          top: 22px;
          left: 22px;
          right: 22px;
        }
        .controls {
          left: 22px;
          right: 22px;
          bottom: 22px;
        }
        .hero {
          left: 8%;
          bottom: 29%;
        }
        .hero h1 {
          font-size: 49px;
        }
        .top-right {
          gap: 16px;
        }
        .left-controls,
        .right-controls {
          gap: 15px;
        }
        .right-controls #record {
          display: none;
        }
        .hint {
          bottom: 106px;
          font-size: 9px;
        }
        .caption {
          bottom: 23%;
        }
        .wordmark {
          font-size: 9px;
          letter-spacing: 0.2em;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="scene"
      aria-label="日蚀窗口，实时渲染的冰冻行星和推进阵列"
    ></canvas>
    <div class="frame"></div>
    <header class="top">
      <div class="wordmark">ECLIPSE WINDOW</div>
      <div class="top-right">
        <button class="text-button" id="quality" title="切换渲染清晰度">
          画质 · 自动</button
        ><button class="text-button" id="fullscreen" title="全屏 F">
          全屏 ↗
        </button>
      </div>
    </header>
    <section class="hero">
      <div class="eyebrow">A WORLD IN DEPARTURE</div>
      <h1>日蚀窗口</h1>
      <p>穿过漫长的夜。带着我们的世界。</p>
      <button class="enter" id="enter">进入日蚀 <span>↗</span></button
      ><small>42 秒实时演算 · 建议佩戴耳机</small>
    </section>
    <div class="caption" id="caption">
      <div class="zh">我们带着家，离开。</div>
      <div class="en">WE TAKE OUR WORLD WITH US.</div>
    </div>
    <div class="hint" id="hint">
      拖动环绕 · 滚轮靠近 · 空格暂停 · H 隐藏界面
    </div>
    <div class="controls">
      <input
        id="seek"
        class="seek"
        type="range"
        min="0"
        max="42"
        step="0.01"
        value="0"
        aria-label="时间轴"
      />
      <div class="transport">
        <div class="left-controls">
          <button class="control" id="play">播放</button
          ><button class="control" id="restart" title="从地表重新出发 R">
            重播</button
          ><span id="clock">00:00 / 00:42</span>
        </div>
        <div class="right-controls">
          <button class="control" id="sound" aria-pressed="false">
            声音 · 关</button
          ><button class="control" id="record">录制影片</button
          ><button class="control" id="hide" title="按 H 恢复界面">
            隐藏界面
          </button>
        </div>
      </div>
    </div>
    <div class="loading">正在建立世界</div>
    <div class="toast" id="toast" role="status"></div>
    <div class="error" id="error">
      <div>
        <strong>这个世界需要 WebGL 2</strong>
        <p id="error-detail">请用启用硬件加速的新版 Chrome 或 Edge 打开。</p>
        <button class="enter" onclick="location.reload()">重新载入 ↗</button>
      </div>
    </div>
    <script>
      "use strict";
      // Everything is generated locally, including cached terrain maps and audio.
      // No network requests, imported artwork, model files or sound files.
      const canvas = document.getElementById("scene");
      const gl = canvas.getContext("webgl2", {
        alpha: false,
        antialias: false,
        powerPreference: "high-performance",
        preserveDrawingBuffer: true,
      });
      const ui = Object.fromEntries(
        [
          "enter",
          "play",
          "restart",
          "seek",
          "clock",
          "sound",
          "record",
          "hide",
          "quality",
          "fullscreen",
          "caption",
          "toast",
        ].map((id) => [id, document.getElementById(id)]),
      );
      function showError(message) {
        document.getElementById("error-detail").textContent = message;
        document.getElementById("error").classList.add("show");
      }
      function toast(message) {
        ui.toast.textContent = message;
        ui.toast.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => ui.toast.classList.remove("show"), 3600);
      }
      if (!gl) {
        showError("请用启用硬件加速的新版 Chrome 或 Edge 打开。");
      } else {
        try {
          main();
        } catch (error) {
          console.error(error);
          showError(error.message);
        }
      }

      function main() {
        const DURATION = 42;
        const hdr = !!gl.getExtension("EXT_color_buffer_float");
        const state = {
          time: 0,
          preview: true,
          playing: false,
          muted: true,
          quality: 0,
          scale: 1,
          dragging: false,
          yaw: 0,
          pitch: 0,
          zoom: 0,
          recording: false,
          disposed: false,
        };
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        const mix = (a, b, t) => a + (b - a) * t;
        const smooth = (a, b, x) => {
          const t = clamp((x - a) / (b - a), 0, 1);
          return t * t * (3 - 2 * t);
        };
        const vadd = (a, b) => a.map((v, i) => v + b[i]);
        const vsub = (a, b) => a.map((v, i) => v - b[i]);
        const vmul = (a, k) => a.map((v) => v * k);
        const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
        const cross = (a, b) => [
          a[1] * b[2] - a[2] * b[1],
          a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0],
        ];
        const norm = (a) => vmul(a, 1 / Math.max(1e-8, Math.hypot(...a)));
        const vertex = `#version 300 es
precision highp float;
out vec2 vUv;
void main() {
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  vUv=p;
  gl_Position=vec4(p*2.-1.,0.,1.);
}`;
        const noise = `float hash(float n) {
  return fract(sin(n)*43758.5453123);
}
float hash3(vec3 p) {
  p=fract(p*.1031);
  p+=dot(p,p.yzx+33.33);
  return fract((p.x+p.y)*p.z);
}
float noise3(vec3 p) {
  vec3 i=floor(p),f=fract(p);
  f=f*f*(3.-2.*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p) {
  float v=0.,a=.5;
  for(int i=0;i<5;i++) {
    v+=a*noise3(p);
    p=p*2.03+vec3(7.1,1.7,3.4);
    a*=.5;
  }
  return v;
}
vec2 sphere(vec3 ro,vec3 rd,vec3 c,float r) {
  vec3 oc=ro-c;
  float b=dot(oc,rd),h=b*b-dot(oc,oc)+r*r;
  if(h<0.)return vec2(-1.);
  h=sqrt(h);
  return vec2(-b-h,-b+h);
}`;
        const common = `precision highp float;
uniform vec2 uResolution;
uniform float uTime;
uniform vec3 uEye;
uniform mat3 uCamera;
uniform mat4 uVP;
uniform vec3 uSun;
uniform float uEclipse;`;
        const sceneFragment = `#version 300 es
${common}
in vec2 vUv;
out vec4 outColor;
${noise}
uniform samplerCube uTerrain;
uniform samplerCube uGas;
float terrain(vec3 direction) {
  return textureLod(uTerrain,direction,0.).r*.25;
}
const vec3 GIANT=vec3(-19.,25.,-60.);
const float GR=33.;
vec3 rayDirection() {
  vec2 uv=(gl_FragCoord.xy*2.-uResolution)/uResolution.y;
  return normalize(uCamera*vec3(uv,-1.65));
}
vec3 stars(vec3 rd) {
  vec3 color=vec3(.0018,.0035,.008);
  float dust=noise3(rd*4.+vec3(2,3,7));
  float band=exp(-pow((rd.x*.45+rd.y*.83+rd.z*.26+.12)*4.,2.));
  color+=vec3(.025,.036,.05)*pow(dust,3.)*band;
  color+=vec3(.035,.015,.012)*pow(noise3(rd*7.+17.),5.)*band;
  for(int i=0;i<3;i++) {
    float scale=140.+float(i)*127.;
    vec3 p=rd*scale;
    vec3 cell=floor(p);
    vec3 center=cell+.15+.7*vec3(hash3(cell+4.),hash3(cell+11.),hash3(cell+39.));
    float distance=length(p-center);
    float h=hash3(cell+73.);
    float star=exp(-distance*distance*(90.+float(i)*35.))*step(.986,h);
    vec3 tint=mix(vec3(.62,.77,1.),vec3(1.,.76,.5),hash3(cell+19.));
    color+=tint*star*(.25+hash3(cell+9.)*1.7);
  }
  float alignment=max(0.,dot(rd,uSun));
  float angular=acos(clamp(alignment,-1.,1.));
  color+=vec3(1.3,.76,.30)*(.0009/(angular*angular+.0006));
  color+=vec3(6.,4.4,2.5)*(1.-smoothstep(.014,.019,angular));
  return color;
}
vec3 gasSurface(vec3 p,vec3 rd) {
  vec3 n=normalize(p-GIANT);
  vec3 q=n;
  float rotation=uTime*.001;
  float c=cos(rotation),s=sin(rotation);
  q.xz=mat2(c,-s,s,c)*q.xz;
  vec3 col=textureLod(uGas,q,0.).rgb;
  float light=max(0.,dot(n,normalize(vec3(.8,.3,.5))));
  float rim=pow(1.-max(0.,dot(n,-rd)),4.);
  return col*(.012+pow(light,1.4)*.9)+vec3(.25,.13,.06)*rim*(.05+light)*.45;
}
vec3 iceSurface(vec3 p,vec3 rd) {
  vec3 n=normalize(p);
  vec4 surface=textureLod(uTerrain,n,0.);
  float coarse=surface.a;
  vec3 tangent=normalize(cross(n,vec3(.1,1.,.03)));
  vec3 bitangent=cross(n,tangent);
  float e=.0018;
  float h=terrain(n);
  float bumpStrength=mix(90.,30.,smoothstep(4.,20.,length(uEye-p)));
  vec3 normal=normalize(n-tangent*(terrain(normalize(n+tangent*e))-h)*bumpStrength-bitangent*(terrain(normalize(n+bitangent*e))-h)*bumpStrength);
  float grain=noise3(p*270.);
  normal=normalize(normal+tangent*(grain-.5)*.25+bitangent*(noise3(p*270.+17.)-.5)*.25);
  float crack=surface.b;
  vec3 col=mix(vec3(.08,.13,.17),vec3(.55,.64,.65),clamp(surface.g,0.,1.));
  col*=1.-crack*.77;
  float sun=max(0.,dot(normal,uSun));
  float eclipse=mix(1.,.10,uEclipse);
  float fill=max(0.,dot(normal,normalize(vec3(-.5,.5,.3))));
  vec3 lit=col*(vec3(.008,.019,.035)+fill*vec3(.08,.13,.17)+sun*eclipse*vec3(1.6,1.12,.7));
  float spec=pow(max(0.,dot(reflect(-uSun,normal),-rd)),48.);
  lit+=spec*eclipse*.34;
  float ignition=smoothstep(10.,16.,uTime);
  float pattern=pow(max(0.,noise3(n*65.)-.64)*4.,4.);
  lit+=vec3(.035,.27,.40)*crack*ignition*.018;
  float groundLight=exp(-length(p.xz-vec2(0.,-.9))*1.3)*smoothstep(12.,13.,uTime);
  lit+=col*vec3(.12,.6,1.1)*groundLight;
  float shockAge=uTime-12.35;
  float shock=exp(-pow((length(p.xz-vec2(0.,-.9))-shockAge*1.8)*8.,2.))*step(0.,shockAge)*exp(-shockAge*1.5);
  lit+=vec3(.13,.55,.8)*shock*.4;
  lit+=vec3(1.,.37,.07)*pattern*.06*smoothstep(.4,.7,coarse)*(1.-sun*eclipse);
  float facing=pow(1.-max(0.,dot(n,-rd)),5.);
  lit+=vec3(.018,.07,.12)*facing;
  return lit;
}
void main() {
  vec3 rd=rayDirection();
  vec3 color=stars(rd);
  float nearest=1000.;
  vec2 giantHit=sphere(uEye,rd,GIANT,GR);
  if(giantHit.x>0.) {
    nearest=giantHit.x;
    color=gasSurface(uEye+rd*nearest,rd);
  }
  // A tilted, finely banded ring, with the planet casting a real geometric shadow.
  vec3 ringNormal=normalize(vec3(.1,.93,.35));
  float denom=dot(rd,ringNormal);
  if(abs(denom)>.0001) {
    float t=dot(GIANT-uEye,ringNormal)/denom;
    vec3 p=uEye+rd*t-GIANT;
    float r=length(p);
    if(t>0.&&t<nearest&&r>39.&&r<61.) {
      float footprint=max(fwidth(r),.0001);
      float stripes=.52+.20*sin(r*7.)*exp(-footprint*7.)+.14*sin(r*38.)*exp(-footprint*38.)+.08*sin(r*107.)*exp(-footprint*107.);
      float gap=smoothstep(46.8,47.2,r)*(1.-smoothstep(48.1,48.5,r));
      float edge=smoothstep(39.,40.,r)*(1.-smoothstep(59.,61.,r));
      float alpha=clamp(stripes,0.,1.)*edge*(1.-gap*.9)*.85;
      vec2 sh=sphere(GIANT+p+uSun*.1,uSun,GIANT,GR);
      float lit=sh.x>0.?.045:.68;
      vec3 ringColor=mix(vec3(.20,.16,.13),vec3(.68,.51,.38),.5+.25*sin(r*.7)+.15*sin(r*3.));
      color=mix(color,ringColor*lit,alpha);
    }
  }
  vec2 planet=sphere(uEye,rd,vec3(0),8.18);
  if(planet.y>0.) {
    float t=max(0.,planet.x);
    bool hit=false;
    for(int i=0;i<75;i++) {
      vec3 p=uEye+rd*t;
      float d=length(p)-8.-terrain(normalize(p));
      if(d<max(.0003,t*.00004)) {
        hit=true;
        break;
      }
      t+=max(.0002,d*.65);
      if(t>planet.y||t>nearest)break;
    }
    if(hit&&t<nearest) {
      nearest=t;
      vec3 p=uEye+rd*t;
      color=iceSurface(p,rd);
      float groundFog=1.-exp(-t*.028*exp(-max(0.,length(uEye)-8.3)*2.));
      color=mix(color,vec3(.025,.065,.095),groundFog*.65);
    }
  }
  // Thin atmosphere, integrated along the ray. The exterior remains transparent.
  vec2 air=sphere(uEye,rd,vec3(0),8.36);
  if(air.y>0.) {
    float a=max(0.,air.x),b=min(nearest,air.y);
    float stepSize=max(0.,b-a)/12.;
    vec3 scatter=vec3(0);
    float optical=0.;
    for(int i=0;i<12;i++) {
      vec3 p=uEye+rd*(a+(float(i)+.5)*stepSize);
      float height=max(0.,length(p)-8.10);
      float density=exp(-height*19.);
      float light=.17+max(0.,dot(normalize(p),uSun))*mix(1.,.3,uEclipse);
      scatter+=vec3(.11,.43,.75)*density*stepSize*light;
      optical+=density*stepSize;
    }
    color=color*exp(-optical*.12)+scatter*.22;
  }
  // Lens glint is blocked by the giant, just as the solar disk is.
  vec2 solarOcclusion=sphere(uEye,uSun,GIANT,GR);
  if(solarOcclusion.x<0.) {

              }
            }
          }
          requestAnimationFrame(tick);
        }
        // Deterministic inspection entry point, also useful for choosing a cover frame.
        window.eclipse = {
          state,
          seek(time) {
            state.preview = false;
            state.playing = false;
            state.time = clamp(time, 0, DURATION);
            document.body.classList.add("playing");
            render(state.time);
            updateUI();
          },
          render: () => render(state.preview ? 29 : state.time),
          get camera() {
            return lastCamera;
          },
          get resolution() {
            return [canvas.width, canvas.height];
          },
          get engineCount() {
            return instanceCount;
          },
        };
        requestAnimationFrame(tick);
      }
    </script>
  </body>
</html>
